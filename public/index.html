<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>TarotFaliAI · veri</title>
  <style>
    body { margin: 0; padding: 48px 20px; background: #0B0714; color: #EDE6F5;
           font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-weight: 400; letter-spacing: .02em; }
    a { color: #E2C27A; }
    code { background: #1B1326; padding: 2px 6px; border-radius: 4px; }
    #durum { margin-top: 24px; padding: 16px; border: 1px solid #3A2C4F; border-radius: 12px; }
  </style>
</head>
<body>
<main>
  <h1>TarotFaliAI</h1>
  <p>Astarot uygulamasının günlük burç yorumu dosyaları. Her gece GitHub
     Actions ile üretiliyor.</p>
  <p>Uygulamanın okuduğu dosya: <a href="v1/gunluk.json"><code>v1/gunluk.json</code></a></p>
  <div id="durum">Yükleniyor…</div>
</main>
<script>
  fetch('v1/gunluk.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (feed) {
      var days = feed.gunler.map(function (d) { return d.tarih + ' (' + d.model + ')'; });
      document.getElementById('durum').textContent =
        'Son güncelleme: ' + feed.guncellendi + ' — içindeki günler: ' + days.join(', ');
    })
    .catch(function (e) {
      document.getElementById('durum').textContent =
        'Henüz yorum yayınlanmadı ya da dosya okunamadı (' + e.message + ').';
    });
</script>
</body>
</html>
