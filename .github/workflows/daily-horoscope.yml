name: Burç yorumları

on:
  schedule:
    - cron: "17 20 * * *"
    - cron: "47 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Tarih (YYYY-MM-DD). Boşsa: TR saatiyle 18:00'den sonra yarın, önce bugün. Haftalık/aylık bu günün haftası ve ayı."
        required: false
        default: ""
      period:
        description: "Hangi yorum"
        type: choice
        options: [all, daily, weekly, monthly]
        default: all
      force:
        description: "Zaten varsa yeniden üret"
        type: boolean
        default: false

concurrency:
  group: daily-horoscope
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Yorumları üret
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          HOROSCOPE_DATE: ${{ inputs.date }}
          HOROSCOPE_PERIOD: ${{ inputs.period }}
          HOROSCOPE_FORCE: ${{ inputs.force }}
        run: python -m horoscope

      - name: Repoya yaz
        if: ${{ !cancelled() }}
        env:
          DAY: ${{ steps.generate.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Burç yorumları: $DAY"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - uses: actions/upload-pages-artifact@v5
        if: ${{ !cancelled() }}
        with:
          path: public

  deploy:
    needs: generate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
